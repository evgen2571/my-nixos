#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

# Only discover project roots under ~/dev; live tmux and configured sessions
# remain available independently of zoxide's history.
[frecency]
list_command = "@SESH_PROJECT_LIST@"

[[session]]
name = "cp"
path = "~/dev/cp"
startup_command = "tmux rename-window nvim; nvim ."
windows = [ "term" ]

[[wildcard]]
pattern = "~/dev/*"
startup_command = "tmux rename-window nvim; nvim ."
windows = [ "term" ]

[[window]]
name = "term"
startup_script = "clear"

