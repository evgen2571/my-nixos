#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

[[session]]
name = "cp"
path = "~/dev/cp"
startup_command = "tmux rename-window nvim; exec nvim ."
windows = [ "term" ]

[[wildcard]]
pattern = "~/dev/*"
startup_command = "tmux rename-window nvim; exec nvim ."
windows = [ "term", "agent" ]

[[window]]
name = "term"

[[window]]
name = "agent"
startup_script = "@SESH_REMOTE_WINDOW@"
