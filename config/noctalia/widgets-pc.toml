# Optional PC layout. Noctalia 5.2 has pixel centers and resolution remapping, without edge anchors.
[desktop_widgets]
enabled = true
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

[desktop_widgets.widget.desktop-widget-0000000000000001]
cx = 352.0
cy = 1336.0
output = "HDMI-A-1"
type = "clock"
box_height = 144.0
box_width = 592.0

[desktop_widgets.widget.desktop-widget-0000000000000001.settings]
background = false
center_text = false
clock_style = "digital"
color = "primary"
format = "{:%I:%M %p} "

[desktop_widgets.widget.desktop-widget-0000000000000002]
cx = 336.0
cy = 1232.0
output = "HDMI-A-1"
type = "audio_visualizer"
box_height = 96.0
box_width = 544.0

[desktop_widgets.widget.desktop-widget-0000000000000002.settings]
background = false
background_opacity = 0.48
bands = 32
centered = true
mirrored = true
show_when_idle = true

[lockscreen_widgets]
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-1" ]

[lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
type = "login_box"
box_height = 70.0
box_width = 400.0
cx = 1280.0
cy = 1321.0
output = "DP-1"

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
type = "login_box"
box_height = 70.0
box_width = 400.0
cx = 1280.0
cy = 1321.0
output = "HDMI-A-1"
