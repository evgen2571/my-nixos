[widget.active_window]
icon_size = 14.0
max_length = 260.0
min_length = 80.0
title_scroll = "none"
type = "active_window"

[widget.bluetooth]
capsule = true
capsule_opacity = 0.0
type = "bluetooth"

[widget.brightness]
capsule = true
capsule_opacity = 0.0
type = "brightness"

[widget.clipboard]
capsule = true
capsule_opacity = 0.0
type = "clipboard"

[widget.clock]
capsule = true
capsule_opacity = 0.0
capsule_padding = 10.0
scale = 1.1000000000000001
type = "clock"

[widget.control-center]
capsule = true
capsule_opacity = 0.0
type = "control-center"

[widget.cpu]
stat = "cpu_usage"
type = "sysmon"

[widget.date]
format = "{:%a %d %b}"
type = "clock"

[widget.input_volume]
device = "input"
type = "volume"

[widget.keyboard_layout]
hide_when_single_layout = false
type = "keyboard_layout"

[widget.launcher]
capsule = true
capsule_opacity = 0.0
type = "launcher"

[widget.lock_keys]
display = "short"
hide_when_off = false
show_caps_lock = true
show_num_lock = true
show_scroll_lock = false
type = "lock_keys"

[widget.media]
art_size = 16.0
capsule = true
capsule_opacity = 0.0
max_length = 220.0
min_length = 80.0
title_scroll = "none"
type = "media"

[widget.network]
capsule = true
capsule_opacity = 0.0
type = "network"

[widget.network_rx]
stat = "net_rx"
type = "sysmon"

[widget.network_tx]
stat = "net_tx"
type = "sysmon"

[widget.notifications]
capsule = true
capsule_opacity = 0.0
type = "notifications"

[widget.output_volume]
device = "output"
type = "volume"

[widget.ram]
stat = "ram_used"
type = "sysmon"

[widget.session]
capsule = true
capsule_opacity = 0.0
type = "session"

[widget.spacer]
type = "spacer"

[widget.temp]
stat = "cpu_temp"
type = "sysmon"

[widget.tray]
capsule = true
capsule_opacity = 0.0
type = "tray"

[widget.volume]
capsule = true
capsule_opacity = 0.0
type = "volume"

[widget.wallpaper]
capsule = true
capsule_opacity = 0.0
type = "wallpaper"

[widget.workspaces]
