[bar]
order = [ "default" ]

    [bar.default]
    auto_hide = false
    background_opacity = 0.66999995708465576

    border = "outline"
    border_width = 0.0

    capsule = true
    capsule_fill = "surface_variant"
    capsule_group = []
    capsule_opacity = 1.0
    capsule_padding = 6.0
    capsule_thickness = 0.75999999046325684

    center = [ "clock", "workspaces" ]
    contact_shadow = true
    enabled = true

    font_family = "Hurmit Nerd Font"
    font_weight = 500

    layer = "top"

    margin_edge = 0
    margin_ends = 0
    margin_opposite_edge = 1

    padding = 14
    panel_overlap = 1
    position = "top"

    radius = 0
    radius_bottom_left = 0
    radius_bottom_right = 0
    radius_top_left = 0
    radius_top_right = 0

    reserve_space = true
    scale = 1.0
    shadow = true
    start = [ "launcher", "wallpaper", "media" ]
    thickness = 23
    widget_spacing = 6
