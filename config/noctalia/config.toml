[audio]
enable_sounds = false

[bar.default]
background_opacity = 0.74
capsule = true
capsule_radius = 0
capsule_opacity = 0.0
center = ["clock", "workspaces"]
contact_shadow = true
end = [ "notifications", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
margin_ends = 0
margin_opposite_edge = 1
radius = 0
start = [ "tray", "media" ]
thickness = 23

[calendar]
enabled = true
refresh_minutes = 5

[calendar.account.personal_google]
calendars = []
color = ""
name = "evgen2571"
provider = ""
server_url = ""
type = "google"
username = ""

[dock]
background_opacity = 0.0
margin_edge = 8

[include]
files = ["/nix/store/lrrxjrv8sa3hxs3gf7jha8lxll8r5rjv-noctalia/widgets-pc.toml"]

[keybinds]
validate = ["Return", "KP_Enter"]

[location]
address = "Minsk, Belarus"

[notification]
background_opacity = 1.0

[osd]
background_opacity = 1.0

[plugins]
auto_update = "none"
enabled = ["noctalia/example", "noctalia/bongocat", "noctalia/timer"]

[shell]
corner_radius_scale = 0.0
clipboard_history_max_entries = 1000
date_format = "%a %I:%M %p"
font_family = "Hurmit Nerd Font"
niri_overview_type_to_launch_enabled = true
umbriel_audio_provider_enabled = true
umbriel_overview_type_to_launch_enabled = true

[shell.greeter_sync]
auto_sync = true

[shell.panel]
clipboard_placement = "attached"
floating_offset = 4
launcher_placement = "attached"
open_near_click_clipboard = true
open_near_click_control_center = true
open_near_click_launcher = true
open_near_click_wallpaper = true
transparency_mode = "glass"

[shell.screenshot]
directory = "/home/evgen2571/screenshots"

[shell.shadow]
direction = "center"

[system.monitor]
gpu_poll_seconds = 0.0

[theme]
builtin = "Ayu"
community_palette = "ADW"
source = "wallpaper"

[theme.templates]
builtin_ids = [
    "cava",
    "gtk3",
    "gtk4",
    "kcolorscheme",
    "kitty",
    "umbriel",
    "niri",
]
community_ids = [
    "codex",
    "opencode",
    "sonora",
    "telegram",
    "libreoffice",
    "neovim",
    "obsidian",
    "prismlauncher",
    "bat",
    "lazygit",
    "starship",
    "yazi"
]

[theme.templates.user.niri-dropdown]
enabled = true
input_path = "$XDG_CONFIG_HOME/noctalia/templates/niri-dropdown.kdl"
output_path = "$XDG_CONFIG_HOME/niri/noctalia-dropdown.kdl"

[theme.templates.user.niri-layout]
enabled = true
input_path = "$XDG_CONFIG_HOME/noctalia/templates/niri-layout.kdl"
output_path = "$XDG_CONFIG_HOME/niri/noctalia-layout.kdl"

[theme.templates.user.nvim-base16]
enabled = true
input_path = "$XDG_CONFIG_HOME/nvim/lua/matugen-template.lua"
output_path = "$XDG_CONFIG_HOME/nvim/lua/matugen.lua"
post_hook = "pkill -SIGUSR1 nvim"

[wallpaper]
enabled = false

[wallpaper.automation]
recursive = true

[widget.clock]
capsule_padding = 10.0
scale = 1.1
font_scale = 0.85
format = "{:%I:%M %p}"
capsule_radius = "auto"

[widget.clipboard]
enabled = false

[widget.media]
capsule_padding = 14
hide_when_no_media = true
max_length = 500

[widget.network]
show_label = false

[widget.tray]
drawer = true
enabled = true
scale = 0.9

[widget.volume]
show_label = false

[widget.workspaces]
anchor = true
hide_when_empty = true
max_label_chars = 8
show_all_outputs = true
style = "minimal"

[widget.wallpaper.actions]
left = "exec /nix/store/5gcj5fq1rxq936sy16j5b971yi4g99kg-skwd-suite-binary-1.0.0-beta.26/bin/skwd-wall-v2"
