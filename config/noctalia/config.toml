[audio]
enable_overdrive = false
enable_sounds = false

sound_volume = 0.5

[backdrop]
blur_intensity = 0.5
enabled = false
tint_intensity = 0.30000001192092896

[brightness]
enable_ddcutil = false
ignore_mmids = []
minimum_brightness = 0.0

[calendar]
enabled = true
refresh_minutes = 5

    [calendar.account.personal_google]
    calendars = []
    color = ""
    name = ""
    provider = ""
    server_url = ""
    type = "google"
    username = ""

[control_center]
sidebar = "compact"
sidebar_section = "compact"

width = 700

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

[dock]
active_monitor_only = false
active_opacity = 1.0
active_scale = 1.0

auto_hide = false
background_opacity = 0.0
cross_axis_padding = 8
enabled = false
icon_size = 48

inactive_opacity = 0.85000002384185791
inactive_scale = 0.85000002384185791

item_spacing = 6

launcher_icon = "grid-dots"
launcher_position = "none"

magnification = true
magnification_scale = 1.4500000476837158

main_axis_padding = 16

margin_edge = 8
margin_ends = 0

pinned = []
position = "bottom"

radius = 16
radius_bottom_left = 16
radius_bottom_right = 16
radius_top_left = 16
radius_top_right = 16

reserve_space = true
shadow = true

show_dots = false
show_instance_count = true
show_running = true

[hooks]
battery_charging = []
battery_discharging = []
battery_percentage_changed = []
battery_plugged = []

bluetooth_disabled = []
bluetooth_enabled = []

colors_changed = []
logging_out = []
power_profile_changed = []
rebooting = []

session_locked = []
session_unlocked = []

shutting_down = []
started = []
theme_mode_changed = []
wallpaper_changed = []

wifi_disabled = []
wifi_enabled = []

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 2.0

    [idle.behavior.lock]
    action = "lock"
    command = ""
    enabled = false
    resume_command = ""
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    command = ""
    enabled = false
    resume_command = ""
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    command = ""
    enabled = false
    resume_command = ""
    timeout = 660.0

[keybinds]
cancel = [ "Escape" ]
down = [ "Down" ]
left = [ "Left" ]
right = [ "Right" ]
up = [ "Up" ]
validate = [ "Return", "KP_Enter" ]

[location]
address = ""
auto_locate = false
sunrise = ""
sunset = ""

[lockscreen]
allow_empty_password = false
blur_intensity = 0.5
blurred_desktop = false
enabled = true
fingerprint = true
monitors = []
tint_intensity = 0.30000001192092896
wallpaper = ""

[nightlight]
enabled = false
force = false

temperature_day = 6500
temperature_night = 4000

[notification]
background_opacity = 1.0
collapse_on_dismiss = true
enable_daemon = true
layer = "top"
monitors = []

offset_x = 20
offset_y = 8

position = "top_right"
scale = 1.0

show_actions = true
show_app_name = true

[osd]
background_opacity = 1.0
monitors = []

offset_x = 20
offset_y = 8

orientation = "horizontal"

position = "top_center"
position_vertical = "top_center"

scale = 1.0

    [osd.kinds]
    bluetooth = true
    brightness = true
    caffeine = true
    dnd = true
    keyboard_layout = true
    lock_keys = true
    media = true
    nightlight = true
    power_profile = true
    privacy = true

    volume = true
    volume_input = true
    volume_output = true

    wifi = true

[plugins]
auto_update = "none"
enabled = [ "noctalia/example", "noctalia/bongocat", "noctalia/timer" ]

    [[plugins.source]]
    enabled = true
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    enabled = true
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[accessibility]
ui_scale = 1.0

[shell]
app_icon_colorize = false

clipboard_auto_paste = "auto"
clipboard_confirm_clear_history = true
clipboard_enabled = true
clipboard_history_max_entries = 1000
clipboard_image_action_command = ""

corner_radius_scale = 1.0
date_format = "%I, %M %p"
disable_mipmaps = false
font_family = "Hurmit Nerd Font"
launch_apps_as_systemd_services = false
niri_overview_type_to_launch_enabled = true
offline_mode = false
password_style = "default"
polkit_agent = false
screen_time_enabled = false
settings_show_advanced = true
setup_wizard_enabled = true
shared_gl_context = true
show_location = true
telemetry_enabled = false
time_format = "{:%H:%M}"

    [shell.greeter_sync]
    auto_sync = true

    [shell.animation]
    enabled = true
    speed = 1.0

    [shell.mpris]
    blacklist = []

    [shell.panel]
    borders = true
    clipboard_placement = "attached"
    control_center_placement = "attached"
    floating_offset = 4
    launcher_placement = "attached"

    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = false
    open_near_click_wallpaper = true

    session_placement = "attached"
    shadow = true
    transparency_mode = "glass"
    wallpaper_placement = "attached"

    [shell.privacy]
    cam_filter_regex = ""
    mic_filter_regex = ""

    [shell.screen_corners]
    enabled = false
    size = 32

    [shell.screenshot]
    confirm_region = false
    copy_to_clipboard = true
    filename_pattern = ""
    freeze_screen = true

    pipe_command = ""
    pipe_to_command = false

    save_to_file = true

    [shell.session.power]

    [[shell.session.actions]]
    action = "lock"
    command = ""
    enabled = true
    glyph = ""
    label = ""
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    command = ""
    enabled = true
    glyph = ""
    label = ""
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    command = ""
    enabled = true
    glyph = ""
    label = ""
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    command = ""
    enabled = true
    glyph = ""
    label = ""
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    command = ""
    enabled = true
    glyph = ""
    label = ""
    shortcut = "5"
    variant = "destructive"

    [shell.shadow]
    alpha = 0.55000001192092896
    direction = "center"

[system.monitor]
cpu_poll_seconds = 2.0
cpu_temp_activity_threshold = 60.0
cpu_temp_critical_threshold = 85.0
cpu_temp_sensor_path = ""
cpu_usage_activity_threshold = 50.0
cpu_usage_critical_threshold = 90.0

disk_poll_seconds = 10.0
enabled = true

gpu_poll_seconds = 0.0
gpu_temp_activity_threshold = 60.0
gpu_temp_critical_threshold = 85.0
gpu_usage_activity_threshold = 50.0
gpu_usage_critical_threshold = 95.0
gpu_vram_activity_threshold = 50.0
gpu_vram_critical_threshold = 90.0

memory_poll_seconds = 2.0

net_rx_activity_threshold = 1.0
net_rx_critical_threshold = 50.0
net_tx_activity_threshold = 1.0
net_tx_critical_threshold = 50.0

network_poll_seconds = 3.0

ram_pct_activity_threshold = 60.0
ram_pct_critical_threshold = 90.0

swap_pct_activity_threshold = 20.0
swap_pct_critical_threshold = 80.0

[theme]
builtin = "Ayu"
community_palette = "ADW"
custom_palette = ""
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri" ]
    community_ids = [ "sonora", "telegram", "libreoffice", "neovim", "obsidian", "lazygit", "yazi", "codex", "opencode", "bat", "obs", "prismlauncher" ]

    enable_builtin_templates = true
    enable_community_templates = true

        [theme.templates.user.nvim-base16]
        input_path = "~/.config/nvim/lua/matugen-template.lua"
        output_path = "~/.config/nvim/lua/matugen.lua"
        post_hook = "pkill -SIGUSR1 nvim"

        [theme.templates.user.niri-layout]
        input_path = "$XDG_CONFIG_HOME/noctalia/templates/niri-layout.kdl"
        output_path = "$XDG_CONFIG_HOME/niri/noctalia-layout.kdl"

        [theme.templates.user.niri-dropdown]
        input_path = "$XDG_CONFIG_HOME/noctalia/templates/niri-dropdown.kdl"
        output_path = "$XDG_CONFIG_HOME/niri/noctalia-dropdown.kdl"

[wallpaper]
directory_dark = ""
directory_light = ""

edge_smoothness = 0.30000001192092896
enabled = true

fill_color = ""
fill_mode = "crop"

per_monitor_directories = false

transition = [ "fade", "wipe", "disc", "stripes", "zoom", "honeycomb" ]
transition_duration = 1500.0
transition_on_startup = true

    [wallpaper.automation]
    enabled = false
    interval_seconds = 1800
    order = "random"
    recursive = true

[weather]
effects = true
enabled = true
refresh_minutes = 30
unit = "metric"
