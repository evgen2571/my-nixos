match.title = '^(Configure( Language| Toolbars)?|Properties for .+) — Dolphin$'
default_floating_size = { width = 0.42, height = 0.55 }
default_scrolling_extent = 0.42

[[window_rule]]
match.app_id = '^org\.kde\.ark$'
match.title = '^Ark$'
default_floating = true
default_focused = true
default_maximize_to_edges = false
