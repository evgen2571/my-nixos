# Ported from config/niri/sub/rules; later matching fields take precedence.
# Negative title lookaheads preserve Niri exclusions before workspace placement.

# Fallbacks precede Noctalia's optional theme include.
[colors]
background = "#1e1e2e"
insert_hint = "#ffc87f80"

[[window_rule]]
match.app_id = '^md\.obsidian\.Obsidian$'
default_floating = false
opacity = 1.0

[[window_rule]]
match.app_id = '^md\.obsidian\.Obsidian$'
match.title = '^(?!^(Settings|Community themes|Community plugins|Properties|About|Open vault|Manage vaults)).*$'
default_floating = false
default_maximize_to_edges = true
default_workspace = "study"

[[window_rule]]
match.app_id = '^md\.obsidian\.Obsidian$'
match.title = '^Settings - '
default_floating = true
default_focused = true
default_maximize_to_edges = false
default_floating_size = { width = 0.44, height = 0.76 }
default_position = { x = 20, y = 32, anchor = "top_left" }

[[window_rule]]
match.app_id = '^md\.obsidian\.Obsidian$'
match.title = '^Properties'
default_floating = true
default_focused = true
default_maximize_to_edges = false
default_floating_size = { width = 0.36, height = 0.62 }
default_position = { x = 20, y = 48, anchor = "top_left" }

[[window_rule]]
match.app_id = '^md\.obsidian\.Obsidian$'
match.title = '^(Open vault|Manage vaults)'
default_floating = true
default_focused = true
default_maximize_to_edges = false
default_floating_size = { width = 0.40, height = 0.60 }
default_position = { x = 20, y = 56, anchor = "top_left" }

[[window_rule]]
match.app_id = '^md\.obsidian\.Obsidian$'
match.title = '^About'
default_floating = true
default_focused = true
default_maximize_to_edges = false
default_floating_size = { width = 0.32, height = 0.46 }
default_position = { x = 20, y = 64, anchor = "top_left" }

[[window_rule]]
match.app_id = '^md\.obsidian\.Obsidian$'
match.title = '^Community themes - '
default_floating = true
default_focused = true
default_maximize_to_edges = false
default_floating_size = { width = 0.44, height = 0.76 }
default_position = { x = 20, y = 32, anchor = "top_right" }

[[window_rule]]
match.app_id = '^md\.obsidian\.Obsidian$'
match.title = '^Community plugins - '
default_floating = true
default_focused = true
default_maximize_to_edges = false
default_floating_size = { width = 0.44, height = 0.76 }
default_position = { x = 20, y = 32, anchor = "top_right" }

[[window_rule]]
match.app_id = '^(firefox|google-chrome|chromium-browser|chromium)$'
match.title = '^(?!^(Picture-in-Picture|Picture in picture)$).*$'
default_maximize_to_edges = true
default_workspace = "web"
blur = true

[[window_rule]]
match.app_id = '^(org\.kde\.dolphin|org\.gnome\.Nautilus|thunar|Thunar)$'
default_floating = true
default_focused = true
default_floating_size = { width = 0.62, height = 0.70 }

[[window_rule]]
