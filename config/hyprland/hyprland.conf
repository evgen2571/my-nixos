# Hyprland config generated from your Niri config
# Main file: ~/.config/hypr/hyprland.conf

$mainMod = SUPER

source = ~/.config/hypr/sub/outputs.conf
source = ~/.config/hypr/sub/workspaces.conf
source = ~/.config/hypr/sub/rules.conf
source = ~/.config/hypr/sub/binds.conf
source = ~/.config/hypr/sub/layout.conf
source = ~/.config/hypr/sub/input.conf
source = ~/.config/hypr/sub/startup.conf

# Niri equivalent: environment { XDG_CURRENT_DESKTOP "niri" }
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    focus_on_activate = true
}

xwayland {
    force_zero_scaling = true
}
