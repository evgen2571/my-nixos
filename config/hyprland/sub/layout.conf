# Converted from Niri sub/layout.kdl

general {
    gaps_in = 6
    gaps_out = 6
    border_size = 1
    col.active_border = rgba(003300ff)
    col.inactive_border = rgba(00330088)
    layout = dwindle
}

decoration {
    rounding = 10

    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = niriEase, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, niriEase
    animation = windowsOut, 1, 4, default
    animation = workspaces, 1, 5, niriEase
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}
