# Converted from Niri sub/input.kdl
# Important: scroll_method belongs directly under input on your Hyprland version,
# not inside input:touchpad.

input {
    kb_layout = us,ru
    kb_variant = ,phonetic
    kb_options = grp:alt_shift_toggle,caps:swapescape

    repeat_delay = 250
    repeat_rate = 35

    # Niri: focus-follows-mouse
    follow_mouse = 1

    # Niri: warp-mouse-to-focus / workspace-auto-back-and-forth approximation
    mouse_refocus = true

    # Niri: mouse scroll-factor 1.0
    scroll_factor = 1.0

    # Niri: touchpad scroll-method "two-finger"
    # Some Hyprland versions accept: 2fg / edge / on_button_down / no_scroll.
    scroll_method = 2fg

    touchpad {
        # Niri: tap
        tap-to-click = true

        # Niri: natural-scroll
        natural_scroll = true

        # Niri: touchpad scroll-factor 0.40
        scroll_factor = 0.40
    }
}
