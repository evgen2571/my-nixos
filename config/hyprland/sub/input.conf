# Input configuration converted from Niri input.kdl
input {
    focus_follows_mouse 1
    workspace_switch_on_wrap 1
    warp_cursor_to_active_workspace 1
    kb_layout us,ru
    kb_variant ,phonetic
    kb_options grp:alt_shift_toggle,caps:swapescape
    repeat_delay 250
    repeat_rate 35
    touchpad {
        tap enabled
        natural_scroll enabled
        scroll_method twofinger
        scroll_factor 0.40
    }
    mouse {
        scroll_factor 1.0
    }
}