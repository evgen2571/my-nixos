# Converted from Niri sub/binds.kdl

# Apps
bind = $mainMod, Return, exec, kitty
bind = $mainMod SHIFT, Return, exec, kitty -T dropdown-term
bind = $mainMod, F, exec, zen-beta
bind = $mainMod, E, exec, kitty -T file-manager yazi
bind = $mainMod SHIFT, E, exec, dolphin
bind = $mainMod, C, exec, kitty --title project-session sesh picker -i
bind = $mainMod, O, exec, obsidian
bind = $mainMod, A, exec, anki
bind = $mainMod, B, exec, bruno
bind = $mainMod, M, exec, youtube-music
bind = $mainMod SHIFT, B, exec, bitwarden
bind = $mainMod SHIFT, T, exec, telegram-desktop
bind = $mainMod SHIFT, D, exec, vesktop

# Noctalia v5 IPC
bind = $mainMod, Comma, exec, noctalia msg settings-toggle
bind = $mainMod, Space, exec, noctalia msg panel-toggle launcher
bind = $mainMod, S, exec, noctalia msg panel-toggle control-center
bind = $mainMod, V, exec, noctalia msg panel-toggle clipboard
bind = $mainMod, Y, exec, noctalia msg panel-toggle wallpaper
bind = $mainMod, P, exec, noctalia msg panel-toggle session
bind = $mainMod ALT, L, exec, noctalia msg session lock-and-suspend
bind = CTRL SHIFT, Escape, exec, noctalia msg panel-toggle control-center system

# System controls. Empty modifier field is required for XF86 keys.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ --limit 1.5
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioStop, exec, playerctl stop
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Window management
bind = $mainMod, Q, killactive
bind = $mainMod ALT, Space, togglefloating
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, Z, fullscreen, 1
bind = $mainMod SHIFT, Z, fullscreen, 0

# Focus navigation
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Right, movefocus, r
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Window movement
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Monitor navigation
bind = $mainMod CTRL, Left, focusmonitor, l
bind = $mainMod CTRL, Right, focusmonitor, r
bind = $mainMod CTRL, H, focusmonitor, l
bind = $mainMod CTRL, L, focusmonitor, r
bind = $mainMod, X, focusmonitor, +1

# Move focused window to monitor
bind = $mainMod SHIFT CTRL, Left, movewindow, mon:l
bind = $mainMod SHIFT CTRL, Right, movewindow, mon:r
bind = $mainMod SHIFT CTRL, Down, movewindow, mon:d
bind = $mainMod SHIFT CTRL, Up, movewindow, mon:u
bind = $mainMod SHIFT CTRL, H, movewindow, mon:l
bind = $mainMod SHIFT CTRL, L, movewindow, mon:r
bind = $mainMod SHIFT CTRL, J, movewindow, mon:d
bind = $mainMod SHIFT CTRL, K, movewindow, mon:u

# Relative workspace navigation
bind = $mainMod, Page_Down, workspace, e+1
bind = $mainMod, Page_Up, workspace, e-1
bind = $mainMod, U, workspace, e+1
bind = $mainMod, I, workspace, e-1
bind = $mainMod CTRL, Down, movetoworkspace, e+1
bind = $mainMod CTRL, Up, movetoworkspace, e-1
bind = $mainMod CTRL, U, movetoworkspace, e+1
bind = $mainMod CTRL, I, movetoworkspace, e-1

# Move current workspace to monitor
bind = $mainMod SHIFT, Page_Down, movecurrentworkspacetomonitor, +1
bind = $mainMod SHIFT, Page_Up, movecurrentworkspacetomonitor, -1
bind = $mainMod SHIFT, U, movecurrentworkspacetomonitor, +1
bind = $mainMod SHIFT, I, movecurrentworkspacetomonitor, -1

# Mouse wheel navigation. Hyprland uses mouse_down/mouse_up.
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod CTRL, mouse_down, movetoworkspace, e+1
bind = $mainMod CTRL, mouse_up, movetoworkspace, e-1
bind = $mainMod SHIFT, mouse_down, movefocus, r
bind = $mainMod SHIFT, mouse_up, movefocus, l

# Numbered workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Manual sizing approximations
binde = $mainMod, Minus, resizeactive, -80 0
binde = $mainMod, Equal, resizeactive, 80 0
binde = $mainMod SHIFT, Minus, resizeactive, 0 -80
binde = $mainMod SHIFT, Equal, resizeactive, 0 80

# Screenshots. Replace with your preferred grim/slurp script later if needed.
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" ~/screenshots/screenshot-$(date +'%Y-%m-%d_%H-%M-%S').png
bind = , Print, exec, grim ~/screenshots/screenshot-$(date +'%Y-%m-%d_%H-%M-%S').png
bind = CTRL, Print, exec, grim ~/screenshots/screenshot-$(date +'%Y-%m-%d_%H-%M-%S').png
bind = ALT, Print, exec, grim -g "$(slurp)" ~/screenshots/screenshot-$(date +'%Y-%m-%d_%H-%M-%S').png
