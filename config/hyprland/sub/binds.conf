# Converted from Niri binds.kdl
bind = $mainMod, Return, exec, kitty
bind = $mainMod SHIFT, Return, exec, kitty -T dropdown-term
bind = $mainMod, F, exec, zen-twilight
bind = $mainMod, E, exec, kitty -T file-manager yazi
bind = $mainMod SHIFT, E, exec, dolphin
bind = $mainMod, C, exec, kitty -T editor tms
bind = $mainMod, O, exec, obsidian
bind = $mainMod, A, exec, anki
bind = $mainMod, B, exec, bruno
bind = $mainMod, M, exec, youtube-music
bind = $mainMod SHIFT, B, exec, bitwarden
bind = $mainMod SHIFT, T, exec, telegram-desktop
bind = $mainMod SHIFT, D, exec, vesktop
bind = $mainMod, Comma, exec, noctalia-shell ipc call settings toggle
bind = $mainMod, Space, exec, noctalia-shell ipc call launcher toggle
bind = $mainMod, V, exec, noctalia-shell ipc call launcher clipboard
bind = $mainMod, Y, exec, noctalia-shell ipc call wallpaper toggle
bind = $mainMod, P, exec, noctalia-shell ipc call sessionMenu toggle
bind = $mainMod ALT, L, exec, noctalia-shell ipc call sessionMenu lockAndSuspend
bind = CTRL SHIFT, Escape, exec, noctalia-shell ipc call systemMonitor toggle
bind = XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ --limit 1.5
bind = XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = XF86AudioPause, exec, playerctl play-pause
bind = XF86AudioPlay, exec, playerctl play-pause
bind = XF86AudioPrev, exec, playerctl previous
bind = XF86AudioNext, exec, playerctl next
bind = XF86AudioStop, exec, playerctl stop
bind = XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = $mainMod, Q, killactive, 
bind = $mainMod ALT, Space, togglefloating, 
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Right, movefocus, r
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod CTRL, Left, focusmonitor, l
bind = $mainMod CTRL, Right, focusmonitor, r
bind = $mainMod CTRL, H, focusmonitor, l
bind = $mainMod CTRL, L, focusmonitor, r
bind = $mainMod, X, focusmonitor, +1
bind = $mainMod SHIFT CTRL, Left, movewindow, mon:l
bind = $mainMod SHIFT CTRL, Right, movewindow, mon:r
bind = $mainMod SHIFT CTRL, Down, movewindow, mon:d
bind = $mainMod SHIFT CTRL, Up, movewindow, mon:u
bind = $mainMod SHIFT CTRL, H, movewindow, mon:l
bind = $mainMod SHIFT CTRL, L, movewindow, mon:r
bind = $mainMod SHIFT CTRL, J, movewindow, mon:d
bind = $mainMod SHIFT CTRL, K, movewindow, mon:u
bind = $mainMod, Page_Down, workspace, e+1
bind = $mainMod, Page_Up, workspace, e-1
bind = $mainMod, U, workspace, e+1
bind = $mainMod, I, workspace, e-1
bind = $mainMod CTRL, Down, movetoworkspace, e+1
bind = $mainMod CTRL, Up, movetoworkspace, e-1
bind = $mainMod CTRL, U, movetoworkspace, e+1
bind = $mainMod CTRL, I, movetoworkspace, e-1
bind = $mainMod SHIFT, Page_Down, movecurrentworkspacetomonitor, +1
bind = $mainMod SHIFT, Page_Up, movecurrentworkspacetomonitor, -1
bind = $mainMod SHIFT, U, movecurrentworkspacetomonitor, +1
bind = $mainMod SHIFT, I, movecurrentworkspacetomonitor, -1
bind = $mainMod, WheelScrollDown, workspace, e+1
bind = $mainMod, WheelScrollUp, workspace, e-1
bind = $mainMod CTRL, WheelScrollDown, movetoworkspace, e+1
bind = $mainMod CTRL, WheelScrollUp, movetoworkspace, e-1
bind = $mainMod, WheelScrollRight, movefocus, r
bind = $mainMod, WheelScrollLeft, movefocus, l
bind = $mainMod SHIFT, WheelScrollDown, movefocus, r
bind = $mainMod SHIFT, WheelScrollUp, movefocus, l
