# Converted from Niri sub/rules.kdl
# This file intentionally uses windowrulev2 syntax because your Hyprland rejects
# the newer `windowrule = match:...` syntax.
# Format: windowrulev2 = RULE, class:^(...)$, title:^(...)$

# Global defaults from Niri: geometry-corner-radius + clip-to-geometry.
# In Hyprland these are handled globally in layout.conf with rounding = 10.

# Settings/control dialogs
windowrulev2 = float,class:^(gnome-control-center|pavucontrol|nm-connection-editor|blueman-manager|org\.gnome\.Calculator|gnome-calculator|galculator)$
windowrulev2 = size 45% 55%,class:^(gnome-control-center|pavucontrol|nm-connection-editor|blueman-manager|org\.gnome\.Calculator|gnome-calculator|galculator)$
windowrulev2 = center,class:^(gnome-control-center|pavucontrol|nm-connection-editor|blueman-manager|org\.gnome\.Calculator|gnome-calculator|galculator)$

# Desktop portals and auth prompts
windowrulev2 = float,class:^(xdg-desktop-portal|org\.freedesktop\.impl\.portal\.desktop\..*)$,title:^(Open|Save|Choose|Authenticate|Authentication Required|Password Required).*$
windowrulev2 = size 50% 60%,class:^(xdg-desktop-portal|org\.freedesktop\.impl\.portal\.desktop\..*)$,title:^(Open|Save|Choose|Authenticate|Authentication Required|Password Required).*$
windowrulev2 = center,class:^(xdg-desktop-portal|org\.freedesktop\.impl\.portal\.desktop\..*)$,title:^(Open|Save|Choose|Authenticate|Authentication Required|Password Required).*$

# Browser -> workspace 1/browser
windowrulev2 = workspace 1 silent,class:^(zen-beta|zen|firefox|google-chrome|chromium-browser|chromium)$
windowrulev2 = maximize,class:^(zen-beta|zen|firefox|google-chrome|chromium-browser|chromium)$

# Terminals
windowrulev2 = opacity 0.92 0.92,class:^(kitty|foot)$
windowrulev2 = opacity 0.94 0.94,title:^(editor)$
windowrulev2 = workspace 5 silent,title:^(editor)$
windowrulev2 = maximize,title:^(editor)$

# Dropdown terminal
windowrulev2 = float,title:^(dropdown-term)$
windowrulev2 = size 55% 35%,title:^(dropdown-term)$
windowrulev2 = move 20 10,title:^(dropdown-term)$
windowrulev2 = opacity 0.88 0.88,title:^(dropdown-term)$

# TUI file manager in Kitty
windowrulev2 = float,title:^(file-manager)$
windowrulev2 = size 60% 60%,title:^(file-manager)$
windowrulev2 = center,title:^(file-manager)$
windowrulev2 = opacity 0.94 0.94,title:^(file-manager)$

# GUI file managers
windowrulev2 = float,class:^(org\.kde\.dolphin|org\.gnome\.Nautilus|thunar|Thunar)$
windowrulev2 = size 62% 70%,class:^(org\.kde\.dolphin|org\.gnome\.Nautilus|thunar|Thunar)$
windowrulev2 = center,class:^(org\.kde\.dolphin|org\.gnome\.Nautilus|thunar|Thunar)$

# Editors / code tools -> workspace 5/code
windowrulev2 = workspace 5 silent,class:^(code|Code|codium|VSCodium|dev\.zed\.Zed|zed|bruno|Bruno|com\.usebruno\.Bruno)$
windowrulev2 = maximize,class:^(code|Code|codium|VSCodium|dev\.zed\.Zed|zed|bruno|Bruno|com\.usebruno\.Bruno)$

# Notes -> workspace 4/notes
windowrulev2 = workspace 4 silent,class:^(obsidian|md\.obsidian\.Obsidian)$
windowrulev2 = maximize,class:^(obsidian|md\.obsidian\.Obsidian)$
windowrulev2 = opacity 0.98 0.98,class:^(obsidian|md\.obsidian\.Obsidian)$

# Anki -> workspace 3/anki
windowrulev2 = workspace 3 silent,class:^(anki|net\.ankiweb\.Anki)$
windowrulev2 = maximize,class:^(anki|net\.ankiweb\.Anki)$
windowrulev2 = opacity 0.98 0.98,class:^(anki|net\.ankiweb\.Anki)$

# Anki dialogs
windowrulev2 = float,class:^(anki|net\.ankiweb\.Anki)$,title:^(Add|Add Note|Add Cards|Browse|Preferences|Sync|Добавить|Обзор|Настройки).*$
windowrulev2 = size 57% 78%,class:^(anki|net\.ankiweb\.Anki)$,title:^(Add|Add Note|Add Cards|Browse|Preferences|Sync|Добавить|Обзор|Настройки).*$
windowrulev2 = center,class:^(anki|net\.ankiweb\.Anki)$,title:^(Add|Add Note|Add Cards|Browse|Preferences|Sync|Добавить|Обзор|Настройки).*$

# Password manager
windowrulev2 = float,class:^(Bitwarden|bitwarden|com\.bitwarden\.desktop)$
windowrulev2 = size 40% 70%,class:^(Bitwarden|bitwarden|com\.bitwarden\.desktop)$
windowrulev2 = center,class:^(Bitwarden|bitwarden|com\.bitwarden\.desktop)$

# Messengers -> workspace 2/chats
windowrulev2 = workspace 2 silent,class:^(org\.telegram\.desktop|telegram-desktop|vesktop|Vesktop|discord|Discord|Slack|slack)$
windowrulev2 = maximize,class:^(org\.telegram\.desktop|telegram-desktop|vesktop|Vesktop|discord|Discord|Slack|slack)$

# Music players -> workspace 2/chats
windowrulev2 = workspace 2 silent,class:^(youtube-music|YouTube Music|com\.github\.th_ch\.youtube_music)$
windowrulev2 = float,class:^(youtube-music|YouTube Music|com\.github\.th_ch\.youtube_music)$
windowrulev2 = size 42% 60%,class:^(youtube-music|YouTube Music|com\.github\.th_ch\.youtube_music)$
windowrulev2 = center,class:^(youtube-music|YouTube Music|com\.github\.th_ch\.youtube_music)$

# Video players
windowrulev2 = float,class:^(mpv|io\.mpv\.Mpv)$
windowrulev2 = size 70% 70%,class:^(mpv|io\.mpv\.Mpv)$
windowrulev2 = center,class:^(mpv|io\.mpv\.Mpv)$

# Picture-in-picture
windowrulev2 = float,title:^(Picture-in-Picture|Picture in picture)$
windowrulev2 = pin,title:^(Picture-in-Picture|Picture in picture)$
windowrulev2 = size 30% 30%,title:^(Picture-in-Picture|Picture in picture)$
windowrulev2 = move 100%-12 100%-12,title:^(Picture-in-Picture|Picture in picture)$

# Gaming -> workspace 6/gaming
windowrulev2 = workspace 6 silent,class:^(steam|steamwebhelper|net\.lutris\.Lutris|lutris|org\.prismlauncher\.PrismLauncher|PrismLauncher|sh\.ppy\.osu|osu!|gamescope|cs2|Minecraft|minecraft)$
windowrulev2 = maximize,class:^(steam|steamwebhelper|net\.lutris\.Lutris|lutris|org\.prismlauncher\.PrismLauncher|PrismLauncher|sh\.ppy\.osu|osu!|gamescope|cs2|Minecraft|minecraft)$
windowrulev2 = fullscreen,class:^(gamescope|cs2|Minecraft|minecraft|osu!)$

# OBS -> workspace 6/gaming
windowrulev2 = workspace 6 silent,class:^(com\.obsproject\.Studio|obs)$
windowrulev2 = maximize,class:^(com\.obsproject\.Studio|obs)$

# Quickshell / Noctalia auxiliary windows
windowrulev2 = float,class:^(org\.quickshell|quickshell)$
windowrulev2 = size 50% 50%,class:^(org\.quickshell|quickshell)$
windowrulev2 = center,class:^(org\.quickshell|quickshell)$

# Virtual machines -> workspace 5/code
windowrulev2 = workspace 5 silent,class:^(virt-manager|virt-viewer|remote-viewer)$
windowrulev2 = maximize,class:^(virt-manager|virt-viewer|remote-viewer)$
