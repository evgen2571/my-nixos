# Converted from Niri sub/workspaces-pc.kdl
# Hyprland cannot truly name workspaces like Niri. This maps your named Niri
# workspaces to stable numbered Hyprland workspaces.
# 1=browser, 2=chats, 3=anki, 4=notes, 5=code, 6=gaming

workspace = 1, monitor:DP-1, defaultName:browser
workspace = 2, monitor:DP-1, defaultName:chats
workspace = 3, monitor:DP-1, defaultName:anki
workspace = 4, monitor:HDMI-A-1, defaultName:notes
workspace = 5, monitor:HDMI-A-1, defaultName:code
workspace = 6, monitor:HDMI-A-1, defaultName:gaming
