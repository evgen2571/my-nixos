keys:
  - &admin age1vetj2qje0u9ez5k0vydf2yltj4z3ayhz3xnsmf3kl3e57wx5y5wsurnguy
  - &pc age1ky2ddeweqwtvgvc9022vkwvp2yrrkurjhhu4dyqxhjhw6j9xncps6xt3x9
  - &laptop age1ye84m0a04a6u5v4cuctrtgcqa5czcwvr7q0qf6st6shy4qrs73fspxaa2w
  - &server age19m24yd5je2ett9dghjdd268x0edjx5n077hjf3z094cshs745sqste3cq3

creation_rules:
  # Bootstrap identities.
  # These are deliberately decryptable ONLY by the admin identity.
  - path_regex: secrets/bootstrap/pc\.yaml$
    key_groups:
      - age:
          - *admin

  - path_regex: secrets/bootstrap/laptop\.yaml$
    key_groups:
      - age:
          - *admin

  - path_regex: secrets/bootstrap/server\.yaml$
    key_groups:
      - age:
          - *admin

  # Host-specific secrets.
  - path_regex: secrets/hosts/pc\.yaml$
    key_groups:
      - age:
          - *admin
          - *pc

  - path_regex: secrets/hosts/laptop\.yaml$
    key_groups:
      - age:
          - *admin
          - *laptop

  - path_regex: secrets/hosts/server\.yaml$
    key_groups:
      - age:
          - *admin
          - *server

  # Add this only when you actually have shared secrets.
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - *admin
          - *pc
          - *laptop
          - *server
