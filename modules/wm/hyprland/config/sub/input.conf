input {
    kb_layout = us,ru
    kb_variant = ,phonetic
    kb_options = grp:alt_shift_toggle,caps:swapescape
    repeat_delay = 250
    repeat_rate = 35
    follow_mouse = 1
    touchpad {
        tap-to-click = true
        natural_scroll = true
        scroll_factor = 0.40
    }
}

gestures {
    workspace_swipe = false
}

device {
    name = ""
    scroll_factor = 1.0
}
