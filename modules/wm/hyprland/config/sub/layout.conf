general {
    gaps_in = 6
    gaps_out = 6
    border_size = 1
    col.active_border = rgb(b58bcc)
    col.inactive_border = rgb(444444)
    layout = dwindle
}

dwindle {
    pseudotile = true
    preserve_split = true
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 30
        render_power = 3
        color = rgba(00000070)
    }
}

animations {
    enabled = true
    bezier = easeOutExpo,0.16,1,0.3,1
    bezier = easeOutQuad,0.25,0.46,0.45,0.94
    animation = windows,1,6,easeOutExpo
    animation = windowsOut,1,6,easeOutQuad
    animation = border,1,8,default
    animation = fade,1,6,default
    animation = workspaces,1,6,default
}
