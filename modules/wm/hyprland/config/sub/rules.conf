layerrule = blur,quickshell
layerrule = ignorezero,quickshell
layerrule = blur,noctalia-overview

windowrulev2 = float,class:^(gnome-control-center|pavucontrol|nm-connection-editor|gnome-calculator|galculator|blueman-manager|org\.gnome\.Nautilus|xdg-desktop-portal)$
windowrulev2 = size 50% 50%,class:^(gnome-control-center|pavucontrol|nm-connection-editor|org\.quickshell|org\.kde\.dolphin)$

windowrulev2 = opacity 0.90 0.90 0.90,class:^(kitty|foot)$
windowrulev2 = opacity 0.98 0.98,class:^(obsidian)$

windowrulev2 = workspace name:browser,class:^(zen-twilight)$
windowrulev2 = fullscreen,class:^(zen-twilight)$

windowrulev2 = workspace name:notes,class:^(obsidian)$
# windowrulev2 = fullscreen,class:^(obsidian)$

windowrulev2 = workspace name:code,title:^(editor)$
# windowrulev2 = fullscreen,title:^(editor)$

windowrulev2 = workspace name:gaming,class:^(steam)$
windowrulev2 = fullscreen,class:^(steam)$

windowrulev2 = float,title:^(dropdown-term)$
windowrulev2 = size 50% 30%,title:^(dropdown-term)$
windowrulev2 = move 25% 1%,title:^(dropdown-term)$
windowrulev2 = opacity 0.80 0.80,title:^(dropdown-term)$

windowrulev2 = float,title:^Picture-in-Picture$
windowrulev2 = size 30% 30.5%,title:^Picture-in-Picture$
windowrulev2 = move 69.5% 69.5%,title:^Picture-in-Picture$

windowrulev2 = float,class:^(org\.quickshell|org\.kde\.dolphin)$

windowrulev2 = workspace name:chats,class:^(org\.telegram\.desktop|vesktop)$
windowrulev2 = fullscreen,class:^(org\.telegram\.desktop|vesktop)$
