# Generated from Niri config structure
source = ~/.config/hypr/sub/outputs.conf
source = ~/.config/hypr/sub/workspaces.conf
source = ~/.config/hypr/sub/rules.conf
source = ~/.config/hypr/sub/binds.conf
source = ~/.config/hypr/sub/layout.conf
source = ~/.config/hypr/sub/input.conf
source = ~/.config/hypr/sub/startup.conf

env = XDG_CURRENT_DESKTOP,Hyprland

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}

xwayland {
    force_zero_scaling = true
}
