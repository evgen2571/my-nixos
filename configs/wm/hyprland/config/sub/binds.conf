$mainMod = SUPER

# Apps
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod SHIFT, RETURN, exec, kitty -T dropdown-term
bind = $mainMod, F, exec, zen-twilight
bind = $mainMod, E, exec, dolphin
bind = $mainMod, C, exec, kitty -T editor tms
bind = $mainMod, O, exec, obsidian

# Noctalia
bind = $mainMod, comma, exec, noctalia-shell ipc call settings toggle
bind = $mainMod, SPACE, exec, noctalia-shell ipc call launcher toggle
bind = $mainMod, V, exec, noctalia-shell ipc call launcher clipboard
bind = $mainMod, Y, exec, noctalia-shell ipc call wallpaper toggle
bind = $mainMod, P, exec, noctalia-shell ipc call sessionMenu toggle
bind = $mainMod ALT, L, exec, noctalia-shell ipc call sessionMenu lockAndSuspend
bind = CTRL SHIFT, Escape, exec, noctalia-shell ipc call systemMonitor toggle

# Noctalia Plugins
bind = $mainMod SHIFT, T, exec, noctalia-shell ipc call plugin openSettings pomodoro
bind = $mainMod, T, exec, noctalia-shell ipc call plugin togglePanel pomodoro

# Volume
bindle = , XF86AudioRaiseVolume, exec, noctalia-shell ipc call volume increase 3
bindle = , XF86AudioLowerVolume, exec, noctalia-shell ipc call volume decrease 3
bindl = , XF86AudioMute, exec, noctalia-shell ipc call volume mute
bindl = , XF86AudioMicMute, exec, noctalia-shell ipc call audio micmute

# Media
bindl = , XF86AudioPause, exec, noctalia-shell ipc call media playPause
bindl = , XF86AudioPlay, exec, noctalia-shell ipc call media playPause
bindl = , XF86AudioPrev, exec, noctalia-shell ipc call media previous
bindl = , XF86AudioNext, exec, noctalia-shell ipc call media next

# Brightness
bindle = , XF86MonBrightnessUp, exec, noctalia-shell ipc call brightness increase 5
bindle = , XF86MonBrightnessDown, exec, noctalia-shell ipc call brightness decrease 5

# Window management
bind = $mainMod, Q, killactive
bind = $mainMod, A, fullscreen, 1
bind = $mainMod, Z, fullscreen, 0
bind = $mainMod ALT, SPACE, togglefloating
bind = $mainMod, W, togglesplit

# Focus navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Window movement
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Monitor navigation
bind = $mainMod CTRL, left, focusmonitor, l
bind = $mainMod CTRL, right, focusmonitor, r
bind = $mainMod CTRL, H, focusmonitor, l
bind = $mainMod CTRL, L, focusmonitor, r
bind = $mainMod, X, focusmonitor, +1

# Move to monitor
bind = $mainMod CTRL SHIFT, left, movewindow, mon:l
bind = $mainMod CTRL SHIFT, down, movewindow, mon:d
bind = $mainMod CTRL SHIFT, H, movewindow, mon:l
bind = $mainMod CTRL SHIFT, J, movewindow, mon:d

# Workspace navigation
bind = $mainMod, Page_Down, workspace, e+1
bind = $mainMod, Page_Up, workspace, e-1
bind = $mainMod, U, workspace, e+1
bind = $mainMod, I, workspace, e-1
bind = $mainMod CTRL, down, movetoworkspace, e+1
bind = $mainMod CTRL, up, movetoworkspace, e-1
bind = $mainMod CTRL, U, movetoworkspace, e+1
bind = $mainMod CTRL, I, movetoworkspace, e-1

# Move workspaces
bind = $mainMod SHIFT, Page_Down, movecurrentworkspacetomonitor, +1
bind = $mainMod SHIFT, Page_Up, movecurrentworkspacetomonitor, -1
bind = $mainMod SHIFT, U, movecurrentworkspacetomonitor, +1
bind = $mainMod SHIFT, I, movecurrentworkspacetomonitor, -1

# Mouse wheel navigation
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod CTRL, mouse_down, movetoworkspace, e+1
bind = $mainMod CTRL, mouse_up, movetoworkspace, e-1

# Numbered workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move to numbered workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Layout & sizing
bind = $mainMod, R, togglesplit
bind = $mainMod CTRL, F, fullscreen, 1

# Screenshots
bind = $mainMod SHIFT, S, exec, grimblast copy area
bind = CTRL, Print, exec, grimblast copy output
bind = ALT, Print, exec, grimblast copy active
bind = , Print, exec, grimblast copy area
